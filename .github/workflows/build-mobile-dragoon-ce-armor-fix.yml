name: Build Mobile Dragoon CE Armor Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download current Exosuit Framework assembly
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "mdce/lib" | Out-Null
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/AobaKuma/MechsuitFramework/main/1.6/Assemblies/Exosuit.dll" `
            -OutFile "mdce/lib/Exosuit.dll"

      - name: Build DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore "mdce/Source/MobileDragoonCEArmorFix.csproj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build "mdce/Source/MobileDragoonCEArmorFix.csproj" `
            --configuration Release `
            --no-restore `
            --output "mdce/build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble and validate mod
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $modRoot = "mdce/MobileDragoon_CE_ArmorFix"
          $assemblyDir = Join-Path $modRoot "1.6/CE/Assemblies"
          New-Item -ItemType Directory -Force -Path $assemblyDir | Out-Null
          Copy-Item `
            "mdce/build/MobileDragoonCEArmorFix.dll" `
            (Join-Path $assemblyDir "MobileDragoonCEArmorFix.dll") `
            -Force
          if (-not (Test-Path (Join-Path $assemblyDir "MobileDragoonCEArmorFix.dll"))) {
            throw "Compiled DLL was not copied into the mod."
          }
          [xml](Get-Content (Join-Path $modRoot "About/About.xml")) | Out-Null
          [xml](Get-Content (Join-Path $modRoot "LoadFolders.xml")) | Out-Null
          [xml](Get-Content (Join-Path $modRoot "1.6/CE/Patches/MobileDragoon_CE_ArmorFix.xml")) | Out-Null
          Compress-Archive `
            -Path $modRoot `
            -DestinationPath "MobileDragoon_CE_ArmorFix_1.0.0.zip" `
            -Force

      - name: Upload ready-to-use mod
        uses: actions/upload-artifact@v4
        with:
          name: MobileDragoon_CE_ArmorFix_1.0.0
          path: MobileDragoon_CE_ArmorFix_1.0.0.zip
          if-no-files-found: error
