      - name: Download current Exosuit Framework assembly
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "work\MobileDragoon_CE_ArmorFix"
          New-Item -ItemType Directory -Force -Path (Join-Path $root "lib") | Out-Null
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/AobaKuma/MechsuitFramework/main/1.6/Assemblies/Exosuit.dll" `
            -OutFile (Join-Path $root "lib\Exosuit.dll")

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build DLL
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "work\MobileDragoon_CE_ArmorFix"
          dotnet restore (Join-Path $root "Source\MobileDragoonCEArmorFix.csproj")
          dotnet build (Join-Path $root "Source\MobileDragoonCEArmorFix.csproj") `
            --configuration Release `
            --no-restore `
            --output (Join-Path $root "build")
          New-Item -ItemType Directory -Force -Path (Join-Path $root "1.6\CE\Assemblies") | Out-Null
          Copy-Item `
            (Join-Path $root "build\MobileDragoonCEArmorFix.dll") `
            (Join-Path $root "1.6\CE\Assemblies\MobileDragoonCEArmorFix.dll") `
            -Force

      - name: Package mod
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "work\MobileDragoon_CE_ArmorFix"
